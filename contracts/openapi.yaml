x-contract-rules:
  all_writes_require_csrf_except_anonymous_session_creation: true
  request_id_response_header: X-Request-ID
  all_resource_reads_require_authorization_checks: true
  conversation_stream_events:
    message_started:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        seq:
          type: integer
      additionalProperties: false
      required:
      - message_id
      - session_id
      - seq
    message_delta:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        delta:
          type: string
      additionalProperties: false
      required:
      - message_id
      - delta
    message_completed:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        seq:
          type: integer
        status:
          type: string
          enum:
          - completed
      additionalProperties: false
      required:
      - message_id
      - seq
      - status
    message_error:
      type: object
      properties:
        message_id:
          type: string
          format: uuid
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
      required:
      - message_id
      - error
  policy: SSE 中途出错由 message_error 传输；重连 GET /messages 可恢复完成消息，不支持原 token 流原位恢复。来自内部
    Provider 的 reasoning 字段不可透传。
