openapi: 3.1.0
info:
  title: 问与书 Web MVP API
  version: 1.0.0
  description: SAD V1.0 的外部 API 契约。所有 UUID 都是服务端验证的资源引用，不能用 UUID 代替鉴权。SSE 分片由服务端安全检查后发送，断线从消息列表恢复已完成消息。
servers:
- url: /api/v1
tags:
- name: Auth
- name: Content
- name: Exploration
- name: Reading
- name: Catalog
- name: Conversation
- name: Handoff
- name: Safety
- name: Health
