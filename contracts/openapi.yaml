components:
  securitySchemes:
    ActorCookieAuth:
      type: apiKey
      in: cookie
      name: wqs_session
      description: HttpOnly Secure session cookie. CSRF header additionally required
        for write actions.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        request_id:
          type: string
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      - request_id
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
      required:
      - error
    SessionCreated:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
      additionalProperties: false
      required:
      - expires_at
      - csrf_token
      description: 'Set-Cookie: wqs_session=...; HttpOnly; Secure; SameSite=Lax'
    Topic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        audience:
          type: string
          enum:
          - adult
          - teen
          - child
          - all
      additionalProperties: false
      required:
      - id
      - slug
      - title
      - audience
    Option:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
      additionalProperties: false
      required:
      - id
      - label
    QuestionStep:
      properties:
        id:
          type: string
          title: Id
        prompt:
          type: string
          title: Prompt
        options:
          items:
            $ref: '#/components/schemas/Option'
          type: array
          title: Options
        optional:
          type: boolean
          title: Optional
        multiple:
          type: boolean
          title: Multiple
          default: false
        source_url:
          type: string
          title: Source Url
      additionalProperties: false
      type: object
      required:
      - id
      - prompt
      - options
      - optional
      title: QuestionStep
    DailyQuestion:
      type: object
      properties:
        question_id:
          type: string
          format: uuid
        question_version_id:
          type: string
          format: uuid
        local_date:
          type: string
          format: date
        timezone:
          type: string
        title:
          type: string
        intro:
          type: string
        topic:
          $ref: '#/components/schemas/Topic'
        first_step:
          $ref: '#/components/schemas/QuestionStep'
      additionalProperties: false
      required:
      - question_id
      - question_version_id
      - local_date
      - timezone
      - title
      - intro
      - topic
      - first_step
    ExplorationCreate:
      type: object
      properties:
        question_version_id:
          type: string
          format: uuid
      additionalProperties: false
      required:
      - question_version_id
    ExplorationAnswer:
      properties:
        step_id:
          type: string
          title: Step Id
        option_id:
          type: string
          title: Option Id
        option_ids:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 6
            minItems: 1
          - type: 'null'
          title: Option Ids
        supplementary_text:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Supplementary Text
      additionalProperties: false
      type: object
      required:
      - step_id
      - option_id
      title: ExplorationAnswer
    ExplorationState:
      type: object
      properties:
        exploration_id:
          type: string
          format: uuid
        question_version_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - active
          - completed
          - expired
        next_step:
          anyOf:
          - $ref: '#/components/schemas/QuestionStep'
          - type: 'null'
        reading_intent_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        answers:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ExplorationAnswerRecord'
          description: 仅返回当前身份该探索的已提交答案，按提交顺序排列。
      additionalProperties: false
      required:
      - exploration_id
      - question_version_id
      - status
      - next_step
      - reading_intent_id
    ReadingPreferences:
      type: object
      properties:
        genre:
          anyOf:
          - type: string
          - type: 'null'
        style:
          type: array
          items:
            type: string
        difficulty:
          anyOf:
          - type: string
            enum:
            - easy
            - medium
            - advanced
          - type: 'null'
        language:
          type: string
          enum:
          - zh-CN
      additionalProperties: false
      required:
      - genre
      - style
      - difficulty
      - language
    ReadingIntentCreate:
      type: object
      properties:
        source_type:
          type: string
          enum:
          - direct_search
        purpose:
          type: string
          enum:
          - interest
          - learning
          - exploration
        central_question:
          anyOf:
          - type: string
            maxLength: 1200
          - type: 'null'
        topics:
          type: array
          items:
            type: string
          maxItems: 10
        focus:
          anyOf:
          - type: string
            maxLength: 1200
          - type: 'null'
        preferences:
          $ref: '#/components/schemas/ReadingPreferences'
      additionalProperties: false
      required:
      - source_type
      - purpose
      - central_question
      - topics
      - focus
      - preferences
    ReadingIntentCreated:
      type: object
      properties:
        reading_intent_id:
          type: string
          format: uuid
        schema_version:
          type: integer
          const: 1
      additionalProperties: false
      required:
      - reading_intent_id
      - schema_version
    RecommendationCreate:
      type: object
      properties:
        reading_intent_id:
          type: string
          format: uuid
        limit:
          type: integer
          minimum: 1
          maximum: 3
          default: 3
      additionalProperties: false
      required:
      - reading_intent_id
    VerifiedBook:
      type: object
      properties:
        work_id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        recommendation_reason:
          type: string
        rank:
          type: integer
          minimum: 1
          maximum: 3
        verification_status:
          type: string
          enum:
          - verified
        evidence_urls:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: false
      required:
      - work_id
      - title
      - author
      - summary
      - recommendation_reason
      - rank
      - verification_status
      - evidence_urls
    TaskError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
      additionalProperties: false
      required:
      - code
      - message
      - retryable
    RecommendationJob:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - processing
          - succeeded
          - partial
          - failed
        items:
          type: array
          items:
            $ref: '#/components/schemas/VerifiedBook'
          maxItems: 3
        error:
          anyOf:
          - $ref: '#/components/schemas/TaskError'
          - type: 'null'
        created_at:
          type: string
          format: date-time
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      additionalProperties: false
      required:
      - job_id
      - status
      - items
      - error
      - created_at
      - completed_at
    BookDetail:
      type: object
      properties:
        work_id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        original_title:
          anyOf:
          - type: string
          - type: 'null'
        editions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              isbn13:
                anyOf:
                - type: string
                - type: 'null'
              publisher:
                anyOf:
                - type: string
                - type: 'null'
              translator:
                anyOf:
                - type: string
                - type: 'null'
            additionalProperties: false
            required:
            - id
            - isbn13
            - publisher
            - translator
        verified_topics:
          type: array
          items:
            type: string
        evidence_urls:
          type: array
          items:
            type: string
            format: uri
      additionalProperties: false
      required:
      - work_id
      - title
      - author
      - original_title
      - editions
      - verified_topics
      - evidence_urls
    ConversationCreate:
      properties:
        kind:
          type: string
          const: discussion
          title: Kind
        topic_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Topic Id
        exploration_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Exploration Id
      additionalProperties: false
      type: object
      required:
      - kind
      - topic_id
      title: ConversationCreate
    Conversation:
      properties:
        conversation_id:
          type: string
          format: uuid
          title: Conversation Id
        kind:
          type: string
          const: discussion
          title: Kind
        topic_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Topic Id
        status:
          type: string
          enum:
          - active
          - closed
          - expired
          title: Status
        last_message_seq:
          type: integer
          minimum: 0.0
          title: Last Message Seq
        created_at:
          type: string
          format: date-time
          title: Created At
        provider_mode:
          type: string
          enum:
          - mock
          - deepseek
          title: Provider Mode
          default: mock
      additionalProperties: false
      type: object
      required:
      - conversation_id
      - kind
      - topic_id
      - status
      - last_message_seq
      - created_at
      title: Conversation
    ConversationMessage:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        seq:
          type: integer
          minimum: 1.0
          title: Seq
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        status:
          type: string
          enum:
          - pending
          - generating
          - completed
          - failed
          - blocked
          title: Status
        content:
          type: string
          title: Content
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
